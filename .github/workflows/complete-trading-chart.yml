name: Complete Trading Chart

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch-chart:
    if: ${{ !startsWith(github.event.head_commit.message, 'feat: complete trading chart') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Patch chart implementation
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('app/src/main/java/com/notash/cryptobacktester/ui/ProfessionalTerminal.kt')
          text = path.read_text(encoding='utf-8')

          old = re.search(r'@Composable private fun CandleChart\(.*?\n@Composable private fun CandleInfo', text, re.S)
          if not old:
              raise SystemExit('CandleChart block not found')

          new_chart = r'''@Composable private fun CandleChart(candles: List<Candle>, trades: List<TradeResult>, selected: Int?, onSelect: (Int) -> Unit, modifier: Modifier) {
    if (candles.isEmpty()) { Box(modifier.background(Panel2, RoundedCornerShape(18.dp)), contentAlignment = Alignment.Center) { Text("Loading CoinEx candles…", color = Muted) }; return }
    val renderCandles = aggregateCandlesForChart(candles, maxBars = 600)
    Canvas(modifier.background(Panel2, RoundedCornerShape(18.dp)).pointerInput(renderCandles) { detectTapGestures { point -> onSelect(((point.x / size.width) * renderCandles.size).toInt().coerceIn(0, renderCandles.lastIndex)) } }) {
        val chartPoints = trades.mapNotNull { trade -> runCatching { buildTradingChartPoint(renderCandles, trade) }.getOrNull() }
        val levels = buildList {
            addAll(renderCandles.flatMap { listOf(it.low, it.high) })
            chartPoints.forEach { point ->
                add(point.entryPrice); add(point.exitPrice)
                if (point.stopLoss > 0.0) add(point.stopLoss)
                if (point.takeProfit > 0.0) add(point.takeProfit)
            }
        }
        val minPrice = levels.minOrNull() ?: renderCandles.minOf { it.low }
        val maxPrice = levels.maxOrNull() ?: renderCandles.maxOf { it.high }
        val range = (maxPrice - minPrice).takeIf { it > 0 } ?: 1.0
        val step = size.width / renderCandles.size
        val bodyWidth = (step * 0.58f).coerceAtLeast(2f)
        fun y(price: Double): Float = size.height - ((price - minPrice) / range * size.height).toFloat()

        for (grid in 1..4) {
            val gy = size.height * grid / 5f
            drawLine(Divider, Offset(0f, gy), Offset(size.width, gy), 1f)
        }

        renderCandles.forEachIndexed { index, candle ->
            val x = index * step + step / 2f
            val bullish = candle.close >= candle.open
            val candleColor = if (bullish) Green else Red
            val top = y(maxOf(candle.open, candle.close))
            val bottom = y(minOf(candle.open, candle.close))
            drawLine(candleColor, Offset(x, y(candle.high)), Offset(x, y(candle.low)), 1.5f)
            drawRect(candleColor, Offset(x - bodyWidth / 2f, top), androidx.compose.ui.geometry.Size(bodyWidth, maxOf(2f, bottom - top)))
            if (selected == index) {
                drawLine(PrimaryText, Offset(x, 0f), Offset(x, size.height), 1.5f)
                drawLine(PrimaryText, Offset(0f, y(candle.close)), Offset(size.width, y(candle.close)), 1f)
            }
        }

        chartPoints.forEach { point ->
            val entryX = point.entryIndex * step + step / 2f
            val exitX = point.exitIndex * step + step / 2f
            val sideColor = if (point.side == com.notash.cryptobacktester.core.Side.LONG) Green else Red
            drawLine(sideColor, Offset(entryX, y(point.entryPrice)), Offset(exitX, y(point.exitPrice)), 2.5f)

            if (point.stopLoss > 0.0) {
                drawLine(Red.copy(alpha = 0.75f), Offset(entryX, y(point.stopLoss)), Offset(exitX, y(point.stopLoss)), 1.5f)
            }
            if (point.takeProfit > 0.0) {
                drawLine(Gold.copy(alpha = 0.9f), Offset(entryX, y(point.takeProfit)), Offset(exitX, y(point.takeProfit)), 1.5f)
            }

            val entryY = y(point.entryPrice)
            if (point.side == com.notash.cryptobacktester.core.Side.LONG) {
                drawLine(Green, Offset(entryX, entryY + 10f), Offset(entryX, entryY - 2f), 3f)
                drawLine(Green, Offset(entryX, entryY - 2f), Offset(entryX - 5f, entryY + 3f), 3f)
                drawLine(Green, Offset(entryX, entryY - 2f), Offset(entryX + 5f, entryY + 3f), 3f)
            } else {
                drawLine(Red, Offset(entryX, entryY - 10f), Offset(entryX, entryY + 2f), 3f)
                drawLine(Red, Offset(entryX, entryY + 2f), Offset(entryX - 5f, entryY - 3f), 3f)
                drawLine(Red, Offset(entryX, entryY + 2f), Offset(entryX + 5f, entryY - 3f), 3f)
            }
            drawCircle(sideColor, 7f, Offset(entryX, entryY), style = androidx.compose.ui.graphics.drawscope.Stroke(width = 2f))

            val exitY = y(point.exitPrice)
            drawCircle(PrimaryText, 7f, Offset(exitX, exitY), style = androidx.compose.ui.graphics.drawscope.Stroke(width = 2f))
            drawCircle(sideColor, 3f, Offset(exitX, exitY))
        }
    }
    Spacer(Modifier.height(7.dp))
    Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
        Text("● LONG", color = Green, fontSize = 9.sp, fontWeight = FontWeight.Bold)
        Text("● SHORT", color = Red, fontSize = 9.sp, fontWeight = FontWeight.Bold)
        Text("○ ENTRY / EXIT", color = PrimaryText, fontSize = 9.sp)
        Text("SL", color = Red, fontSize = 9.sp)
        Text("TP", color = Gold, fontSize = 9.sp)
        Spacer(Modifier.weight(1f))
        Text("${chartPoints.size} trades", color = Muted, fontSize = 9.sp)
    }
}
@Composable private fun CandleInfo'''
          text = text[:old.start()] + new_chart + text[old.end()-len('@Composable private fun CandleInfo'):]

          old_load = '''fun loadChart() { scope.launch { candles = runCatching { repo.loadKlines(market, timeframe, 240) }.getOrDefault(emptyList()) } }'''
          new_load = '''fun loadChart() { scope.launch { val end = System.currentTimeMillis(); val start = end - 30L * 24L * 60L * 60L * 1000L; val history = com.notash.cryptobacktester.data.HistoricalDataManager(); candles = runCatching { history.downloadKlines(market, timeframe, start, end) }.getOrDefault(emptyList()) } }'''
          if old_load not in text:
              raise SystemExit('loadChart block not found')
          text = text.replace(old_load, new_load, 1)
          path.write_text(text, encoding='utf-8')
      - name: Validate patch syntax
        run: git diff --check
      - name: Commit chart completion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/notash/cryptobacktester/ui/ProfessionalTerminal.kt
          if git diff --cached --quiet; then
            echo "No chart changes to commit"
            exit 0
          fi
          git commit -m "feat: complete trading chart"
          git push origin main
