name: ALVEX Strategy Manager Build

on:
  push:
    branches: [feat/strategy-manager-build521]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: gradle testDebugUnitTest
      - name: Build Debug APK
        run: gradle assembleDebug
      - name: Upload Strategy Manager APK
        uses: actions/upload-artifact@v4
        with:
          name: ALVEX-strategy-manager-build521
          path: app/build/outputs/apk/debug/app-debug.apk
