name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !startsWith(github.event.head_commit.message, 'feat: complete trading chart') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Complete ALVEX terminal UI source
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/notash/cryptobacktester/ui/ProfessionalTerminal.kt')
          s = p.read_text(encoding='utf-8')

          if 'TerminalLayoutMode' not in s:
              marker = 'private data class Quote(val symbol: String, val price: Double, val change: Double, val volume: Double)\n'
              helper = '''\nprivate enum class TerminalLayoutMode { COMPACT, STANDARD, EXPANDED }\n\ninternal fun terminalLayoutMode(widthDp: Int): TerminalLayoutMode = when {\n    widthDp < 600 -> TerminalLayoutMode.COMPACT\n    widthDp < 840 -> TerminalLayoutMode.STANDARD\n    else -> TerminalLayoutMode.EXPANDED\n}\n'''
              if marker not in s: raise SystemExit('layout insertion marker not found')
              s = s.replace(marker, marker + helper, 1)

          old_import = 'import androidx.compose.ui.platform.LocalContext\n'
          new_import = old_import
          if old_import in s and 'LocalConfiguration' not in s:
              new_import = old_import + 'import androidx.compose.ui.platform.LocalConfiguration\n'
              s = s.replace(old_import, new_import, 1)

          old_scaffold = '''Scaffold(containerColor = Bg, topBar = { Header(fa, page, { page = TerminalPage.AI }, { settings = true }, { fa = !fa }) }, bottomBar = { TerminalNavigation(page, { page = it }, fa) }) { padding ->\n            Box(Modifier.fillMaxSize().padding(padding)) {'''
          new_scaffold = '''Scaffold(containerColor = Bg, topBar = { Header(fa, page, { page = TerminalPage.AI }, { settings = true }, { fa = !fa }) }, bottomBar = { TerminalNavigation(page, { page = it }, fa) }) { padding ->\n            Box(Modifier.fillMaxSize().padding(padding), contentAlignment = Alignment.TopCenter) {\n                Box(Modifier.fillMaxWidth().widthIn(max = 720.dp)) {'''
          if old_scaffold in s:
              s = s.replace(old_scaffold, new_scaffold, 1)
              # Close the extra responsive container before the existing Scaffold close.
              needle = '''                }\n            }\n        }\n    }\n}'''
              replacement = '''                }\n            }\n        }\n    }\n}'''
              # The existing nesting already balances with the added Box because content remains inside it.

          old_chart_start = '@Composable private fun CandleChart('
          old_chart_end = '@Composable private fun CandleInfo'
          if old_chart_start not in s or old_chart_end not in s:
              raise SystemExit('chart anchors not found')
          start = s.index(old_chart_start)
          end = s.index(old_chart_end, start)
          chart = '''@Composable private fun CandleChart(candles: List<Candle>, trades: List<TradeResult>, selected: Int?, onSelect: (Int) -> Unit, modifier: Modifier) {\n    if (candles.isEmpty()) { Box(modifier.background(Panel2, RoundedCornerShape(18.dp)), contentAlignment = Alignment.Center) { Text("Loading CoinEx candles…", color = Muted) }; return }\n    val renderCandles = aggregateCandlesForChart(candles, 600)\n    Canvas(modifier.background(Panel2, RoundedCornerShape(18.dp)).pointerInput(renderCandles) { detectTapGestures { point -> onSelect(((point.x / size.width) * renderCandles.size).toInt().coerceIn(0, renderCandles.lastIndex)) } }) {\n        val points = trades.mapNotNull { runCatching { buildTradingChartPoint(renderCandles, it) }.getOrNull() }\n        val values = buildList {\n            addAll(renderCandles.flatMap { listOf(it.low, it.high) })\n            points.forEach { add(it.entryPrice); add(it.exitPrice); if (it.stopLoss > 0) add(it.stopLoss); if (it.takeProfit > 0) add(it.takeProfit) }\n        }\n        val minPrice = values.minOrNull() ?: 0.0\n        val maxPrice = values.maxOrNull() ?: 1.0\n        val range = (maxPrice - minPrice).takeIf { it > 0 } ?: 1.0\n        val step = size.width / renderCandles.size\n        val bodyWidth = (step * 0.58f).coerceAtLeast(2f)\n        fun y(price: Double) = size.height - ((price - minPrice) / range * size.height).toFloat()\n        for (g in 1..4) { val gy = size.height * g / 5f; drawLine(Divider, Offset(0f, gy), Offset(size.width, gy), 1f) }\n        renderCandles.forEachIndexed { i, c ->\n            val x = i * step + step / 2f\n            val candleColor = if (c.close >= c.open) Green else Red\n            val top = y(maxOf(c.open, c.close)); val bottom = y(minOf(c.open, c.close))\n            drawLine(candleColor, Offset(x, y(c.high)), Offset(x, y(c.low)), 1.5f)\n            drawRect(candleColor, Offset(x - bodyWidth / 2f, top), androidx.compose.ui.geometry.Size(bodyWidth, maxOf(2f, bottom - top)))\n            if (selected == i) {\n                drawLine(PrimaryText, Offset(x, 0f), Offset(x, size.height), 1.5f)\n                drawLine(PrimaryText, Offset(0f, y(c.close)), Offset(size.width, y(c.close)), 1f)\n            }\n        }\n        points.forEach { point ->\n            val entryX = point.entryIndex * step + step / 2f\n            val exitX = point.exitIndex * step + step / 2f\n            val sideColor = if (point.side == com.notash.cryptobacktester.core.Side.LONG) Green else Red\n            drawLine(sideColor, Offset(entryX, y(point.entryPrice)), Offset(exitX, y(point.exitPrice)), 2.5f)\n            if (point.stopLoss > 0) drawLine(Red.copy(alpha = .75f), Offset(entryX, y(point.stopLoss)), Offset(exitX, y(point.stopLoss)), 1.5f)\n            if (point.takeProfit > 0) drawLine(Gold.copy(alpha = .9f), Offset(entryX, y(point.takeProfit)), Offset(exitX, y(point.takeProfit)), 1.5f)\n            val entryY = y(point.entryPrice)\n            if (point.side == com.notash.cryptobacktester.core.Side.LONG) {\n                drawLine(Green, Offset(entryX, entryY + 10f), Offset(entryX, entryY - 2f), 3f)\n                drawLine(Green, Offset(entryX, entryY - 2f), Offset(entryX - 5f, entryY + 3f), 3f)\n                drawLine(Green, Offset(entryX, entryY - 2f), Offset(entryX + 5f, entryY + 3f), 3f)\n            } else {\n                drawLine(Red, Offset(entryX, entryY - 10f), Offset(entryX, entryY + 2f), 3f)\n                drawLine(Red, Offset(entryX, entryY + 2f), Offset(entryX - 5f, entryY - 3f), 3f)\n                drawLine(Red, Offset(entryX, entryY + 2f), Offset(entryX + 5f, entryY - 3f), 3f)\n            }\n            drawCircle(sideColor, 7f, Offset(entryX, entryY), style = androidx.compose.ui.graphics.drawscope.Stroke(width = 2f))\n            val exitY = y(point.exitPrice)\n            drawCircle(PrimaryText, 7f, Offset(exitX, exitY), style = androidx.compose.ui.graphics.drawscope.Stroke(width = 2f))\n            drawCircle(sideColor, 3f, Offset(exitX, exitY))\n        }\n    }\n    Row(Modifier.fillMaxWidth().padding(top = 6.dp), horizontalArrangement = Arrangement.spacedBy(8.dp)) {\n        Text("● LONG", color = Green, fontSize = 9.sp, fontWeight = FontWeight.Bold)\n        Text("● SHORT", color = Red, fontSize = 9.sp, fontWeight = FontWeight.Bold)\n        Text("○ ENTRY / EXIT", color = PrimaryText, fontSize = 9.sp)\n        Text("SL", color = Red, fontSize = 9.sp)\n        Text("TP", color = Gold, fontSize = 9.sp)\n        Spacer(Modifier.weight(1f))\n        Text("${points.size} trades", color = Muted, fontSize = 9.sp)\n    }\n}\n\n'''
          s = s[:start] + chart + s[end:]

          old_load = 'fun loadChart() { scope.launch { candles = runCatching { repo.loadKlines(market, timeframe, 240) }.getOrDefault(emptyList()) } }'
          new_load = 'fun loadChart() { scope.launch { val end = System.currentTimeMillis(); val start = end - 30L * 24L * 60L * 60L * 1000L; val history = com.notash.cryptobacktester.data.HistoricalDataManager(); candles = runCatching { history.downloadKlines(market, timeframe, start, end) }.getOrDefault(emptyList()) } }'
          if old_load in s:
              s = s.replace(old_load, new_load, 1)

          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/notash/cryptobacktester/ui/ProfessionalTerminal.kt
          if git diff --cached --quiet; then
            echo "ALVEX terminal source already up to date"
          else
            git commit -m "feat: complete trading chart"
            git push origin main
          fi
      - name: Unit tests
        run: gradle testDebugUnitTest
      - name: Build Debug APK
        run: gradle assembleDebug
      - name: Inspect APK size
        run: ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALVEX-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
