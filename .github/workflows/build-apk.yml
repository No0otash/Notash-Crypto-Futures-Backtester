name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Integrate trade report route
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/notash/cryptobacktester/ui/ProfessionalTerminal.kt')
          s = p.read_text()
          old = '                    TerminalPage.BACKTEST -> BacktestScreen(fa, market, { market = it; vm.setMarket(it) }, timeframe, { timeframe = it }, vm, state)\n'
          new = old + '                    TerminalPage.REPORT -> TradeByTradeReport(fa, state.report, Modifier.fillMaxSize())\n'
          if 'TerminalPage.REPORT -> TradeByTradeReport' not in s:
              if old not in s:
                  raise SystemExit('Expected ProfessionalTerminal Backtest route not found.')
              p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/notash/cryptobacktester/ui/ProfessionalTerminal.kt
          git diff --cached --quiet || git commit -m 'feat: connect trade report to terminal navigation'
          git push origin HEAD:main

      - name: Unit tests
        run: gradle testDebugUnitTest
      - name: Build Debug APK
        run: gradle assembleDebug
      - name: Inspect APK size
        run: ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALVEX-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
