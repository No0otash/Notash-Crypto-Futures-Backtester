name: Finish Trade Report UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-verify:
    if: ${{ !contains(github.event.head_commit.message, 'connect trade report to terminal navigation') && !contains(github.event.head_commit.message, 'remove temporary trade report integration workflow') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Integrate report destination
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/notash/cryptobacktester/ui/ProfessionalTerminal.kt')
          s = p.read_text()
          old = 'TerminalPage.BACKTEST -> BacktestScreen(fa, market, { market = it; vm.setMarket(it) }, timeframe, { timeframe = it }, vm, state)'
          new = old + '\n                    TerminalPage.REPORT -> TradeByTradeReport(fa, state.report, Modifier.fillMaxSize())'
          if 'TerminalPage.REPORT -> TradeByTradeReport' not in s:
              if old not in s:
                  raise SystemExit('Expected Backtest routing line was not found; no UI file was changed.')
              p.write_text(s.replace(old, new, 1))
          PY
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/notash/cryptobacktester/ui/ProfessionalTerminal.kt
          git diff --cached --quiet || git commit -m 'feat: connect trade report to terminal navigation'
          git push origin main
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/finish-trade-report-ui.yml || true
          git commit -m 'chore: remove temporary trade report integration workflow' || true
          git push origin main || true
